  - id: "multilingual-parallel-translation-corpus"
    name: "Multilingual Parallel Dialogue & Subtitle Corpus"
    provider: "opus"
    verified_identifier: "opus/multilingual-subtitles"
    version: "1.2"
    download_source: "kaggle"
    task_type: "translation"
    languages: ["en", "es", "fr", "de", "hi", "te", "ta"]
    license: "CC-BY-SA 4.0"
    required_credentials: "none"
    approximate_size_mb: 85
    download_status: "registered"
    local_path: "storage/datasets/parallel_translation"
    train_val_test_split:
      train_pct: 80
      val_pct: 10
      test_pct: 10
    preprocessing:
      - "deduplicate_sentence_pairs"
      - "filter_length_ratio_0.5_to_2.0"
      - "normalize_punctuation"
    citation: "OPUS Parallel Subtitle Repository"

  - id: "lrs3-audiovisual-lipsync"
    name: "LRS3 Lip Reading Sentences (Visual Speech)"
    provider: "oxford"
    verified_identifier: "oxford/lrs3-ted-speech"
    version: "1.0"
    download_source: "kaggle"
    task_type: "lipsync"
    languages: ["en"]
    license: "Research & Non-Commercial Academic"
    required_credentials: "kaggle_api"
    approximate_size_mb: 890
    download_status: "registered"
    local_path: "storage/datasets/lrs3_lipsync"
    train_val_test_split:
      train_pct: 70
      val_pct: 15
      test_pct: 15
    preprocessing:
      - "crop_face_and_mouth_region_96x96"
      - "extract_mel_spectrogram_80_bands"
      - "synchronize_25fps_video_16khz_audio"
    citation: "Afouras et al., LRS3-TED: a large-scale dataset for visual speech recognition, 2018"
