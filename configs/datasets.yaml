# ManaVoice AI — Verified Dataset Registry
# Defines verified datasets for ASR, Translation, TTS, and Lip-Sync research & fine-tuning.

version: "1.0.0"
updated_at: "2026-10-18T14:45:00Z"

datasets:
  - id: "google-fleurs-multilingual"
    name: "FLEURS Multilingual Speech Recognition"
    provider: "google"
    verified_identifier: "google/fleurs"
    version: "1.0"
    download_source: "kaggle"
    task_type: "asr"
    languages: ["en", "hi", "te", "ta", "kn", "ml", "bn", "mr", "es", "fr", "de"]
    license: "CC-BY 4.0"
    required_credentials: "kaggle_api"
    approximate_size_mb: 450
    download_status: "registered"
    local_path: "storage/datasets/fleurs"
    train_val_test_split:
      train_pct: 80
      val_pct: 10
      test_pct: 10
    preprocessing:
      - "resample_16000_mono"
      - "trim_silence"
      - "normalize_unicode_text"
      - "remove_corrupted_audio"
    citation: "Conneau et al., FLEURS: Few-shot Learning Evaluation of Universal Representations of Speech, 2022"

  - id: "mozilla-common-voice-multilingual"
    name: "Mozilla Common Voice Speech Dataset"
    provider: "mozilla"
    verified_identifier: "mozillaorg/common-voice"
    version: "13.0"
    download_source: "kaggle"
    task_type: "asr"
    languages: ["en", "hi", "te", "ta", "mr", "es", "fr", "de"]
    license: "CC0 1.0"
    required_credentials: "kaggle_api"
    approximate_size_mb: 1200
    download_status: "registered"
    local_path: "storage/datasets/common_voice"
    train_val_test_split:
      train_pct: 80
      val_pct: 10
      test_pct: 10
    preprocessing:
      - "validate_audio_duration_3_to_15s"
      - "resample_16000_mono"
      - "filter_empty_transcripts"
    citation: "Ardila et al., Common Voice: A Massively-Multilingual Speech Corpus, 2020"

  - id: "indic-speech-corpus"
    name: "IndicSpeech Indian Language Speech Dataset"
    provider: "ai4bharat"
    verified_identifier: "ai4bharat/indic-speech"
    version: "2.0"
    download_source: "kaggle"
    task_type: "tts"
    languages: ["hi", "te", "ta", "kn", "ml", "bn", "mr"]
    license: "MIT"
    required_credentials: "kaggle_api"
    approximate_size_mb: 680
    download_status: "registered"
    local_path: "storage/datasets/indic_speech"
    train_val_test_split:
